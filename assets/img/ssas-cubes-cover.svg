<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="SSAS Sales Analysis Cubes cover" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
